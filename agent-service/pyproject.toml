[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bc-risk-liveavatar-lite-agent"
version = "0.1.0"
description = "LITE-mode LiveAvatar agent for the BC Risk Educator"
requires-python = ">=3.11,<3.15"
dependencies = [
  "certifi>=2025.8.3",
  "fastapi~=0.116",
  "uvicorn[standard]~=0.35",
  "httpx~=0.28",
  "python-dotenv~=1.1",
  "websockets~=15.0",
  "livekit-agents[silero]~=1.5",
  "livekit-plugins-openai~=1.5",
  "audioop-lts; python_version >= '3.13'",
]

[project.optional-dependencies]
dev = ["pytest~=8.4", "pytest-asyncio~=1.1", "ruff~=0.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
